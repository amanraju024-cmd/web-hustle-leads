<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR Methods Leads</title>
<meta name="description" content="AR Methods lead finder: find local businesses that need a website, track calls and team performance.">
<meta name="theme-color" content="#5a0614">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Cormorant+Garamond:wght@500;600&family=Fraunces:ital,opsz,wght@0,9..144,500..900;1,9..144,600..900&display=swap">
<style>
  /* AR Methods: maroon + cream + gold, from the brand logo */
  :root {
    --bg: #f7f1e6; --card: #fffdf8; --text: #2a1213; --muted: #7a5f58; --border: #e6d9c6; --chip: #f1e7d7;
    --accent: #5a0614; --accent-text: #f3e9d8; --brand: #5a0614; --brand-deep: #48040f; --cream: #f3e9d8; --gold: #b8913f;
    --bad: #b3261e; --bad-bg: #fbe7e4; --warn: #8a5d0c; --warn-bg: #f8eed6; --good: #2e7d4f; --good-bg: #e5f3ea;
    --blue: #2c5aa0; --blue-bg: #e6eefb;
    --display: "Cormorant Garamond", "Times New Roman", serif;
    --body: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --head: "Fraunces", "Georgia", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #170a0b; --card: #231213; --text: #f2e7d4; --muted: #b9a593; --border: #3d2324; --chip: #2e1a1a;
      --accent: #d9b56e; --accent-text: #2a1213; --brand: #4d0e11; --brand-deep: #2e0709; --gold: #d9b56e;
      --bad: #ff8a7f; --bad-bg: #3d1a18; --warn: #e8c06a; --warn-bg: #3a2c14; --good: #6fd39a; --good-bg: #15301f;
      --blue: #8fb4f0; --blue-bg: #1b2738; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #170a0b; --card: #231213; --text: #f2e7d4; --muted: #b9a593; --border: #3d2324; --chip: #2e1a1a;
    --accent: #d9b56e; --accent-text: #2a1213; --brand: #4d0e11; --brand-deep: #2e0709; --gold: #d9b56e;
    --bad: #ff8a7f; --bad-bg: #3d1a18; --warn: #e8c06a; --warn-bg: #3a2c14; --good: #6fd39a; --good-bg: #15301f;
    --blue: #8fb4f0; --blue-bg: #1b2738; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); }
  h1, h2, h3 { text-wrap: balance; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .num { font-variant-numeric: tabular-nums; }

  /* header + nav */
  .top { background: var(--brand); color: var(--cream); padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid var(--gold); }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--cream); text-decoration: none; min-width: 0; }
  .brand b { display: block; font: 600 21px/1 var(--display); letter-spacing: .16em; }
  .brand small { display: block; font-size: 9.5px; letter-spacing: .26em; opacity: .85; margin-top: 3px; }
  .who { display: flex; gap: 12px; align-items: center; font-size: 13px; flex-wrap: wrap; justify-content: flex-end; }
  .who .linkbtn { color: #e6c98a; }
  .role { font-style: normal; font-size: 11px; background: var(--gold); color: #2a1213; border-radius: 999px; padding: 1px 7px; margin-left: 4px; }
  .tabs { display: flex; gap: 4px; background: var(--card); border-bottom: 1px solid var(--border); padding: 0 12px; overflow-x: auto; position: sticky; top: 0; z-index: 5; }
  .tabs a { display: flex; gap: 6px; align-items: center; padding: 12px 12px; color: var(--muted); text-decoration: none; font-weight: 600; font-stretch: 90%; border-bottom: 3px solid transparent; white-space: nowrap; }
  .tabs a.active { color: var(--accent); border-bottom-color: var(--accent); }
  main { max-width: 1000px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 32px; }
  .foot { text-align: center; color: var(--muted); font-size: 13px; padding: 18px 16px calc(24px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--border); }
  .foot b { color: var(--text); }
  h1.page { font: 600 30px/1.1 var(--display); letter-spacing: .02em; margin: 6px 0 14px; }
  h2 { font-size: 16px; margin: 0 0 10px; font-stretch: 90%; }
  .subnav { display: flex; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
  .subnav a { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); text-decoration: none; color: var(--text); background: var(--card); font-size: 14px; }
  .subnav a.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

  /* building blocks */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 8px 0 4px; }
  input, select, textarea { width: 100%; padding: 10px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  textarea { resize: vertical; }
  label.check { display: flex; align-items: center; gap: 6px; font-weight: 400; font-size: 13px; color: var(--muted); }
  label.check input { width: auto; }
  button { font: inherit; cursor: pointer; }
  .primary, .ghost { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px; padding: 10px 16px; font-weight: 600; text-decoration: none; border: 1px solid var(--accent); }
  .primary { background: var(--accent); color: var(--accent-text); }
  .ghost { background: transparent; color: var(--accent); border-color: var(--border); }
  .primary.small, .ghost.small { padding: 6px 12px; font-size: 13px; }
  .primary.wide { width: 100%; margin-top: 14px; }
  button:disabled { opacity: .6; cursor: progress; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; font-size: 13px; cursor: pointer; }
  .notice { padding: 10px 12px; border-radius: 8px; margin: 10px 0; font-size: 14px; }
  .notice.error { background: var(--bad-bg); color: var(--bad); }
  .notice.warn { background: var(--warn-bg); color: var(--warn); }
  .notice.info { background: var(--chip); color: var(--text); }
  .search-opts { grid-column: 1 / -1; display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
  .search-opts select { width: auto; padding: 5px 8px; margin-left: 6px; }
  .source-line { grid-column: 1 / -1; margin: 0; }
  .inline.wide input { max-width: none; flex: 1; }
  .badphone { color: var(--warn); font-weight: 600; font-size: 14px; }
  .maybe { font-size: 13px; color: var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 6px 10px; margin-top: 8px !important; }
  .empty { text-align: center; color: var(--muted); padding: 28px 10px; background: var(--card); border: 1px dashed var(--border); border-radius: 12px; }
  .loading { padding: 30px; text-align: center; color: var(--muted); }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } .toast { transition: none; } }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0 12px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  .chip { border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 6px 12px; border-radius: 999px; font-size: 13px; }
  .chip.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; transition: .25s; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 50; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.25); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.bad { background: var(--bad); color: #fff; }

  /* home */
  .goal-head { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; }
  .goal-head b { font-size: 22px; }
  .bar { height: 12px; background: var(--chip); border-radius: 999px; overflow: hidden; margin: 8px 0; }
  .bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), var(--gold)); border-radius: 999px; }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
  .tiles.six { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .tile { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; min-width: 0; }
  .tile span { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
  .tile b { display: block; font-size: 24px; margin-top: 2px; }
  .tile small { color: var(--muted); font-size: 12px; }
  .quick { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  ul.plain { list-style: none; padding: 0; margin: 0; }
  ul.plain li { padding: 8px 0; border-bottom: 1px solid var(--border); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  li.due.overdue span { color: var(--bad); font-weight: 600; }

  /* search + leads */
  form.search { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; }
  form.search label.check { margin: 0; }
  .list { display: grid; gap: 10px; }
  .lead { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
  .lead.overdue { border-color: var(--bad); box-shadow: inset 4px 0 0 var(--bad); }
  .lead h3 { margin: 0 0 2px; font-size: 16px; }
  .lead p { margin: 2px 0; }
  .lead .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 14px; margin-top: 6px; }
  .phone { font-weight: 700; font-size: 15px; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; vertical-align: 2px; }
  .badge.none { background: var(--bad-bg); color: var(--bad); }
  .badge.social { background: var(--warn-bg); color: var(--warn); }
  .badge.website { background: var(--good-bg); color: var(--good); }
  .pill { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
  .pill.mine { background: var(--good-bg); color: var(--good); }
  .pill.taken { background: var(--chip); color: var(--muted); }
  .status { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--text); white-space: nowrap; vertical-align: 2px; }
  .s-Interested, .o-Interested { background: var(--blue-bg); color: var(--blue); }
  .s-Won, .o-Won { background: var(--good-bg); color: var(--good); }
  .s-Callback, .o-Callback { background: var(--warn-bg); color: var(--warn); }
  .s-Notinterested { background: var(--bad-bg); color: var(--bad); }
  .mylead { grid-template-columns: 1fr; }
  .due-line { color: var(--warn); font-weight: 600; font-size: 14px; }
  .lead.overdue .due-line { color: var(--bad); }
  .log { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 4px; }
  .outcomes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin: 4px 0 8px; }
  .out { border: 1px solid var(--border); background: var(--chip); color: var(--text); border-radius: 8px; padding: 10px 4px; font-weight: 600; font-size: 13px; }
  .o-Notinterested { background: var(--chip); }

  /* tables */
  .tablewrap { overflow-x: auto; }
  table.board { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.board caption { text-align: left; color: var(--muted); font-size: 13px; padding-bottom: 6px; }
  table.board th, table.board td { padding: 9px 8px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  table.board th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  table.board .n { text-align: right; font-variant-numeric: tabular-nums; }
  table.board tr.me td { background: color-mix(in srgb, var(--gold) 16%, transparent); }
  table.board tr.top1 td:first-child, table.board tr.top2 td:first-child, table.board tr.top3 td:first-child { font-size: 18px; }
  table.board tr.off td { opacity: .55; }
  .you { font-style: normal; font-size: 11px; background: var(--accent); color: var(--accent-text); border-radius: 999px; padding: 1px 7px; }
  table.pool input[type=checkbox] { width: 18px; height: 18px; }

  /* admin */
  .feed-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .feed-head h2 { margin: 0; }
  .feed-filters { display: flex; gap: 8px; }
  .feed-filters select, .feed-filters input { width: auto; padding: 6px 8px; }
  ul.feed { list-style: none; padding: 0; margin: 0; max-height: 520px; overflow-y: auto; }
  ul.feed li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  ul.feed time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  .ev-claim span b, .ev-call span b { color: var(--accent); }
  .filters { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .inline { display: flex; gap: 8px; }
  .inline input { max-width: 120px; }
  form.card .primary { margin-top: 12px; }
  .chart svg { width: 100%; height: auto; }
  .chart .axis { stroke: var(--border); }
  .chart .goalline { stroke: var(--gold); stroke-dasharray: 4 4; }
  .chart .barfill { fill: var(--accent); }
  .chart .lbl { fill: var(--muted); font-size: 11px; font-family: var(--body); }

  /* auth */
  .auth { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px 16px 0; background: var(--brand); }
  .auth-card { background: var(--card); width: 100%; max-width: 380px; border-radius: 16px; padding: 24px; text-align: center; border-top: 3px solid var(--gold); }
  .auth-card form { text-align: left; }
  .auth .foot { border: 0; color: var(--cream); opacity: .85; }
  .auth .foot b { color: var(--cream); }
  .auth-logo { background: var(--brand); border-radius: 12px; padding: 8px; width: 64px; height: auto; }
  .wordmark { font: 600 26px/1 var(--display); letter-spacing: .16em; margin: 10px 0 2px; }
  .tagline { font-size: 10px; letter-spacing: .26em; color: var(--muted); margin: 0 0 16px; }
  .auth-card h2 { font-size: 18px; margin: 4px 0 6px; }
  .auth-links { display: flex; justify-content: space-between; margin-top: 14px; }

  @media (max-width: 760px) {
    .tiles.six { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 600px) {
    .who-name { display: none; }
    .tabs a span { display: none; }
    .tabs a { padding: 12px 9px; font-size: 14px; }
    form.search { grid-template-columns: 1fr; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tiles.six { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .lead { grid-template-columns: 1fr; }
    .outcomes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .filters, .grid2 { grid-template-columns: 1fr; }
    h1.page { font-size: 26px; }
  }

  /* ===================== Premium layer: type, depth, motion ===================== */
  body { background:
      radial-gradient(1200px 600px at 110% -10%, color-mix(in srgb, var(--gold) 14%, transparent), transparent 60%),
      radial-gradient(900px 500px at -20% 0%, color-mix(in srgb, var(--brand) 10%, transparent), transparent 60%),
      var(--bg); background-attachment: fixed; }
  h1.page { font: 800 clamp(30px, 5vw, 44px)/1.02 var(--head); letter-spacing: -.02em; font-variation-settings: "opsz" 144;
    background: linear-gradient(100deg, var(--accent) 0%, var(--gold) 55%, var(--accent) 100%); background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 8s ease-in-out infinite; padding-bottom: 4px; }
  h2 { font-family: var(--head); font-weight: 700; font-size: 19px; letter-spacing: -.01em; }
  .lead h3 { font-family: var(--head); font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
  @keyframes sheen { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

  .top { position: relative; overflow: hidden; background:
      radial-gradient(500px 160px at 85% 0%, rgba(201,164,92,.28), transparent 70%),
      linear-gradient(120deg, var(--brand) 0%, var(--brand-deep) 100%); border-bottom: 0; }
  .top::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), #f6e3b4, var(--gold), transparent); background-size: 200% 100%; animation: sheen 5s linear infinite; }
  .brand img { transition: transform .6s cubic-bezier(.2,.8,.2,1); }
  .brand:hover img { transform: rotate(-8deg) scale(1.08); }

  .tabs { backdrop-filter: blur(10px); background: color-mix(in srgb, var(--card) 82%, transparent); }
  .tabs a { position: relative; transition: color .2s; }
  .tabs a::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0;
    background: linear-gradient(90deg, var(--accent), var(--gold)); transform: scaleX(0); transition: transform .35s cubic-bezier(.2,.8,.2,1); }
  .tabs a.active { border-bottom-color: transparent; }
  .tabs a.active::after, .tabs a:hover::after { transform: scaleX(1); }
  .tabs a.lockin-tab { color: var(--bad); }

  .card, .tile, .lead { box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 10px 30px -18px rgba(72,4,15,.45); transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s; }
  .lead:hover, .tile:hover { transform: translateY(-3px); box-shadow: 0 18px 40px -20px rgba(72,4,15,.55); }
  .tile { position: relative; overflow: hidden; }
  .tile::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--gold)); }
  .tile b { font: 800 34px/1.05 var(--head); font-variation-settings: "opsz" 144; letter-spacing: -.02em; }
  .goal-head b { font: 800 30px/1 var(--head); }
  .bar { height: 14px; }
  .bar span { background: linear-gradient(90deg, var(--brand), var(--gold), #f6e3b4); background-size: 200% 100%; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both, sheen 3s linear infinite; }
  @keyframes grow { from { width: 0 !important; } }

  .primary { background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 70%, black)); border-color: transparent;
    box-shadow: 0 8px 20px -10px color-mix(in srgb, var(--accent) 80%, transparent), inset 0 1px 0 rgba(255,255,255,.18); transition: transform .15s, box-shadow .2s, filter .2s; }
  .primary:hover { transform: translateY(-1px); filter: brightness(1.08); box-shadow: 0 12px 26px -10px color-mix(in srgb, var(--accent) 90%, transparent); }
  .primary:active, .ghost:active, .out:active, .chip:active { transform: scale(.97); }
  .ghost, .chip, .out { transition: transform .15s, background .2s, border-color .2s; }
  .ghost:hover, .chip:hover { border-color: var(--gold); }
  .out:hover { border-color: var(--gold); transform: translateY(-1px); }

  /* entrance animation (staggered) */
  .rise { animation: rise .55s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 45ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
  .pop { animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }

  /* auth screen */
  .auth { position: relative; overflow: hidden; background: var(--brand-deep); }
  .auth::before, .auth::after { content: ""; position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(60px); opacity: .55; pointer-events: none; }
  .auth::before { background: radial-gradient(circle, #8a1a28, transparent 60%); top: -20vmax; left: -15vmax; animation: drift 14s ease-in-out infinite alternate; }
  .auth::after { background: radial-gradient(circle, rgba(201,164,92,.55), transparent 60%); bottom: -25vmax; right: -20vmax; animation: drift 18s ease-in-out infinite alternate-reverse; }
  @keyframes drift { to { transform: translate(8vmax, 6vmax) scale(1.1); } }
  .auth-card { position: relative; z-index: 1; animation: rise .7s cubic-bezier(.2,.8,.2,1) both; box-shadow: 0 30px 80px -30px rgba(0,0,0,.6); }
  .auth-logo { animation: pop .8s .15s cubic-bezier(.3,1.6,.5,1) both; }
  .auth .foot { position: relative; z-index: 1; }

  /* confetti */
  .confetti { position: fixed; top: -12px; width: 9px; height: 14px; border-radius: 2px; z-index: 60; pointer-events: none; animation: fall var(--d, 1.6s) cubic-bezier(.25,.6,.4,1) forwards; }
  @keyframes fall { to { transform: translate(var(--x, 0), 105vh) rotate(var(--r, 720deg)); opacity: .9; } }

  /* ===================== I CAN'T BE BOTHERED ===================== */
  .lockin-hero { position: relative; overflow: hidden; border-radius: 18px; padding: clamp(22px, 5vw, 44px); margin-bottom: 14px; color: #f6e9d6;
    background: radial-gradient(600px 300px at 90% 10%, rgba(201,164,92,.35), transparent 60%), linear-gradient(140deg, #1a0306, #4d0710 55%, #170203); }
  .lockin-hero::after { content: ""; position: absolute; inset: 0; background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px); pointer-events: none; }
  .lockin-hero h1 { font: 900 clamp(34px, 8vw, 78px)/.92 var(--head); letter-spacing: -.035em; margin: 0; text-transform: uppercase; font-style: italic; }
  .lockin-hero h1 .cross { position: relative; display: inline-block; }
  .lockin-hero h1 .cross::after { content: ""; position: absolute; left: -2%; right: -2%; top: 52%; height: .12em; background: var(--gold); transform: scaleX(0) rotate(-3deg); transform-origin: left; animation: strike .7s 1s cubic-bezier(.7,0,.2,1) forwards; }
  @keyframes strike { to { transform: scaleX(1) rotate(-3deg); } }
  .lockin-hero .tough { font: italic 700 clamp(18px, 3vw, 26px) var(--head); color: var(--gold); margin: 14px 0 0; opacity: 0; animation: rise .6s 1.6s both; }
  .glitch { animation: shake .5s .2s both; }
  @keyframes shake { 0%,100% { transform: none; } 20% { transform: translate(-3px, 1px) skewX(-4deg); } 40% { transform: translate(3px, -1px) skewX(3deg); } 60% { transform: translate(-2px, 0); } 80% { transform: translate(2px, 1px); } }
  .quote-card { position: relative; padding: 26px 22px 20px; border-radius: 16px; background: var(--card); border: 1px solid var(--border); margin-bottom: 14px; }
  .quote-card blockquote { margin: 0; font: italic 800 clamp(22px, 4vw, 34px)/1.15 var(--head); letter-spacing: -.02em; color: var(--text); }
  .quote-card blockquote::before { content: "“"; position: absolute; top: -18px; left: 14px; font: 900 90px/1 var(--head); color: var(--gold); opacity: .55; }
  .roast { margin: 0 0 14px; padding: 16px 18px; border-radius: 14px; background: var(--bad-bg); color: var(--bad); font-weight: 700; font-size: 17px; border-left: 5px solid var(--bad); }
  .roast small { display: block; font-weight: 500; color: var(--muted); margin-top: 6px; font-size: 13px; }
  .tips { counter-reset: tip; list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .tips li { counter-increment: tip; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: start; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .tips li::before { content: counter(tip, decimal-leading-zero); font: 900 26px/1 var(--head); color: var(--gold); }
  .tips b { display: block; font-family: var(--head); font-size: 17px; }
  .sprint { text-align: center; }
  .sprint .clock { font: 900 clamp(56px, 14vw, 104px)/1 var(--head); letter-spacing: -.04em; font-variant-numeric: tabular-nums; margin: 6px 0 10px; }
  .sprint.running .clock { color: var(--accent); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .75; } }

  @media (prefers-reduced-motion: reduce) {

  }
