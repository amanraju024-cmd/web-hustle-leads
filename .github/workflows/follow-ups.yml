name: Follow-ups and enquiries

on:
  schedule:
    - cron: '17 * * * *'   # every hour; follow-up emails only go out weekdays 8am–6pm Perth
  workflow_dispatch:

concurrency:
  group: follow-ups
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Handle enquiries and send follow-ups
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GREEN_API_ID: ${{ secrets.GREEN_API_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          GREEN_API_URL: ${{ vars.GREEN_API_URL }}
          WA_GROUP_NAME: ${{ vars.WA_GROUP_NAME }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          node scripts/follow-ups.mjs
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
