name: WhatsApp group test

on:
  workflow_dispatch:   # Actions → "WhatsApp group test" → Run workflow

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Send a test message to the team group
        env:
          GREEN_API_ID: ${{ secrets.GREEN_API_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          GREEN_API_URL: ${{ vars.GREEN_API_URL }}
          WA_GROUP_NAME: ${{ vars.WA_GROUP_NAME }}
        run: node scripts/wa-group.mjs test
