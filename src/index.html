<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR Methods Leads</title>
<meta name="description" content="AR Methods lead finder: find local businesses that need a website, track calls and team performance.">
<meta name="theme-color" content="#0b0708">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AR Leads">
<!--PRELOAD-->
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
<link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Geist"; src: url("fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: "Geist Mono"; src: url("fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  /* AR Methods: dark & sleek. Near-black canvas, maroon glow, gold accent. Single dark theme by design. */
  :root {
    color-scheme: dark;
    --bg: #0b0708; --bg-2: #120b0c;
    --surface: rgba(255, 255, 255, .035); --surface-2: rgba(255, 255, 255, .06); --surface-solid: #161011;
    --border: rgba(255, 255, 255, .08); --border-strong: rgba(255, 255, 255, .16);
    --text: #f5ede6; --muted: #a8968e; --faint: #6f605a;
    --maroon: #9c1c30; --maroon-deep: #5a0614; --gold: #e2b968; --gold-2: #f6dca0;
    --accent: var(--gold); --accent-text: #1a0e07;
    --bad: #ff7a73; --bad-bg: rgba(255, 92, 82, .12); --warn: #f4c46a; --warn-bg: rgba(244, 196, 106, .12);
    --good: #5fe0a0; --good-bg: rgba(95, 224, 160, .12); --blue: #8ab4ff; --blue-bg: rgba(138, 180, 255, .12);
    --chip: rgba(255, 255, 255, .06);
    --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --r: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; min-height: 100vh; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
    background:
      radial-gradient(700px 420px at 8% -8%, rgba(156, 28, 48, .45), transparent 70%),
      radial-gradient(600px 380px at 105% 105%, rgba(226, 185, 104, .14), transparent 70%),
      linear-gradient(var(--bg), var(--bg-2)); }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1; opacity: .5;
    background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 48px 48px; mask-image: radial-gradient(ellipse at 30% 0%, #000 0%, transparent 70%); }
  a { color: var(--gold); text-decoration-color: rgba(226,185,104,.4); text-underline-offset: 3px; }
  a:hover { text-decoration-color: var(--gold); }
  h1, h2, h3 { text-wrap: balance; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
  ::selection { background: rgba(226,185,104,.3); }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- header + nav ---------- */
  .top { position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 20px 10px; background: rgba(11, 7, 8, .72); backdrop-filter: blur(16px) saturate(140%);
    border-bottom: 1px solid var(--border); }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; min-width: 0; }
  .brand img { width: 28px; height: auto; filter: drop-shadow(0 0 12px rgba(226,185,104,.35)); transition: transform .5s cubic-bezier(.2,.8,.2,1); }
  .brand:hover img { transform: rotate(-8deg) scale(1.08); }
  .brand b { display: block; font-weight: 800; font-size: 15px; letter-spacing: .22em; }
  .brand small { display: block; font-size: 9px; letter-spacing: .3em; color: var(--muted); margin-top: 2px; }
  .who { display: flex; gap: 12px; align-items: center; font-size: 13px; color: var(--muted); }
  .who-name { color: var(--text); font-weight: 600; }
  .role { font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--gold);
    border: 1px solid rgba(226,185,104,.4); background: rgba(226,185,104,.1); border-radius: 999px; padding: 2px 8px; margin-left: 6px; }
  .who .linkbtn { color: var(--muted); }
  .tabs { position: sticky; top: calc(53px + env(safe-area-inset-top, 0px)); z-index: 9; display: flex; gap: 4px; padding: 10px 16px; overflow-x: auto;
    background: rgba(11, 7, 8, .6); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs a { display: flex; gap: 7px; align-items: center; padding: 8px 14px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px;
    border-radius: 999px; white-space: nowrap; transition: color .2s, background .2s; border: 1px solid transparent; }
  .tabs a span { font-size: 13px; opacity: .8; }
  .tabs a:hover { color: var(--text); background: var(--surface); }
  .tabs a.active { color: var(--text); background: var(--surface-2); border-color: var(--border-strong); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
  .tabs a.lockin-tab { color: #ff8b7a; }
  .tabs a.lockin-tab.active { background: rgba(255, 92, 82, .12); border-color: rgba(255, 92, 82, .35); }
  main { max-width: 1040px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 48px; }
  .foot { text-align: center; color: var(--faint); font-size: 13px; padding: 24px 16px calc(28px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--border); }
  .foot b { color: var(--muted); font-weight: 600; }
  h1.page { font-weight: 800; font-size: clamp(30px, 5vw, 44px); line-height: 1.05; letter-spacing: -.035em; margin: 0 0 22px;
    background: linear-gradient(180deg, #fff 30%, #c9b7ad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h2 { font-size: 16px; font-weight: 700; letter-spacing: -.01em; margin: 0 0 12px; }
  .subnav { display: inline-flex; gap: 4px; margin-bottom: 16px; padding: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .subnav a { padding: 6px 14px; border-radius: 999px; text-decoration: none; color: var(--muted); font-size: 14px; font-weight: 600; white-space: nowrap; }
  .subnav a.on { background: var(--surface-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--border-strong); }

  /* ---------- surfaces ---------- */
  .card, .tile, .lead, .empty, .quote-card, .tips li {
    background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.02)); border: 1px solid var(--border); border-radius: var(--r);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 20px 40px -30px rgba(0,0,0,.8); }
  .card { padding: 18px; margin-bottom: 16px; }
  .tile, .lead { position: relative; transition: transform .25s cubic-bezier(.2,.8,.2,1), border-color .25s, box-shadow .25s; }
  .tile:hover, .lead:hover { transform: translateY(-2px); border-color: rgba(226,185,104,.35); box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 0 0 1px rgba(226,185,104,.08), 0 24px 50px -28px rgba(156,28,48,.8); }

  /* ---------- forms + buttons ---------- */
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 10px 0 6px; letter-spacing: .02em; }
  input, select, textarea { width: 100%; padding: 11px 13px; border: 1px solid var(--border); border-radius: 10px; background: rgba(0,0,0,.35); color: var(--text); font: inherit;
    transition: border-color .2s, box-shadow .2s; }
  input::placeholder, textarea::placeholder { color: var(--faint); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: rgba(226,185,104,.6); box-shadow: 0 0 0 4px rgba(226,185,104,.12); }
  select option { background: var(--surface-solid); }
  textarea { resize: vertical; }
  label.check { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; font-size: 13px; color: var(--muted); margin: 0; }
  label.check input { width: 16px; height: 16px; accent-color: var(--gold); }
  button { font: inherit; cursor: pointer; }
  .primary, .ghost { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; padding: 11px 18px; font-weight: 700; font-size: 14px;
    text-decoration: none; transition: transform .15s, box-shadow .2s, filter .2s, background .2s, border-color .2s; }
  .primary { color: var(--accent-text); border: 0; background: linear-gradient(180deg, var(--gold-2), var(--gold) 60%, #c99a45);
    box-shadow: 0 0 0 1px rgba(255,255,255,.15) inset, 0 10px 28px -10px rgba(226,185,104,.65); }
  .primary:hover { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 0 0 1px rgba(255,255,255,.2) inset, 0 14px 34px -10px rgba(226,185,104,.8); }
  .ghost { color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); }
  .ghost:hover { background: var(--surface-2); border-color: rgba(226,185,104,.45); }
  .primary:active, .ghost:active, .chip:active, .out:active { transform: scale(.97); }
  .primary.small, .ghost.small { padding: 7px 12px; font-size: 13px; border-radius: 8px; }
  .primary.wide { width: 100%; margin-top: 18px; padding: 13px; }
  button:disabled { opacity: .55; cursor: progress; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--gold); font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .notice { padding: 11px 14px; border-radius: 12px; margin: 12px 0; font-size: 14px; border: 1px solid transparent; }
  .notice.error { background: var(--bad-bg); color: var(--bad); border-color: rgba(255,92,82,.25); }
  .notice.warn { background: var(--warn-bg); color: var(--warn); border-color: rgba(244,196,106,.25); }
  .notice.info { background: var(--surface); color: var(--text); border-color: var(--border); }
  .empty { text-align: center; color: var(--muted); padding: 36px 16px; border-style: dashed; }
  .loading { padding: 40px; text-align: center; color: var(--muted); }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0 14px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
  .chip { border: 1px solid var(--border); background: var(--surface); color: var(--muted); padding: 7px 13px; border-radius: 999px; font-size: 13px; font-weight: 600; transition: all .2s; }
  .chip:hover { color: var(--text); border-color: var(--border-strong); }
  .chip.on { color: var(--accent-text); background: var(--gold); border-color: var(--gold); box-shadow: 0 6px 20px -8px rgba(226,185,104,.7); }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; transition: .3s cubic-bezier(.2,.8,.2,1);
    background: rgba(28, 20, 21, .92); backdrop-filter: blur(12px); color: var(--text); padding: 12px 18px; border-radius: 12px; z-index: 50; max-width: calc(100% - 32px);
    border: 1px solid var(--border-strong); box-shadow: 0 20px 50px -10px rgba(0,0,0,.7); font-weight: 600; font-size: 14px; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.bad { border-color: rgba(255,92,82,.5); color: var(--bad); }

  /* ---------- home ---------- */
  .goal { padding: 22px; background: radial-gradient(500px 200px at 0% 0%, rgba(156,28,48,.35), transparent 70%), linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02)); }
  .goal-head { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; color: var(--muted); }
  .goal-head b { font: 800 34px/1 var(--sans); letter-spacing: -.03em; color: var(--text); }
  .bar { height: 10px; background: rgba(255,255,255,.07); border-radius: 999px; overflow: hidden; margin: 14px 0 10px; }
  .bar span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--maroon), #d4513f 45%, var(--gold));
    box-shadow: 0 0 18px rgba(226,120,80,.6); animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes grow { from { width: 0 !important; } }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tiles.six { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .tile { padding: 16px; min-width: 0; overflow: hidden; }
  .tile::after { content: ""; position: absolute; inset: auto -40% -60% auto; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, rgba(226,185,104,.12), transparent 70%); pointer-events: none; }
  .tile span { display: block; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
  .tile b { display: block; font: 800 34px/1.1 var(--sans); letter-spacing: -.04em; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .tile small { color: var(--faint); font-size: 12px; }
  .quick { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  ul.plain { list-style: none; padding: 0; margin: 0; }
  ul.plain li { padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  ul.plain li:last-child { border-bottom: 0; }
  li.due.overdue span { color: var(--bad); font-weight: 700; }

  /* ---------- search + leads ---------- */
  form.search { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end; padding: 20px; }
  form.search label.check { margin: 0; }
  .search-opts { grid-column: 1 / -1; display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
  .search-opts select { width: auto; padding: 6px 10px; margin-left: 6px; }
  .source-line { grid-column: 1 / -1; margin: 0; }
  .list { display: grid; gap: 10px; }
  .lead { padding: 16px 18px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; }
  .lead.overdue { border-color: rgba(255,92,82,.45); box-shadow: inset 3px 0 0 var(--bad); }
  .lead h3 { margin: 0 0 4px; font-size: 17px; font-weight: 700; letter-spacing: -.015em; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .lead p { margin: 3px 0; }
  .lead .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; font-size: 14px; margin-top: 8px; }
  .lead .row a:not(.phone) { color: var(--muted); }
  .lead .row a:not(.phone):hover { color: var(--text); }
  .phone { font-family: var(--mono); font-weight: 700; font-size: 15px; color: var(--gold); text-decoration: none; padding: 4px 10px; border-radius: 8px; background: rgba(226,185,104,.1); border: 1px solid rgba(226,185,104,.25); }
  .phone:hover { background: rgba(226,185,104,.18); }
  .badge, .status, .pill { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; letter-spacing: .01em; border: 1px solid transparent; }
  .badge.none { background: var(--bad-bg); color: var(--bad); border-color: rgba(255,92,82,.3); }
  .badge.social { background: var(--warn-bg); color: var(--warn); border-color: rgba(244,196,106,.3); }
  .badge.website { background: var(--good-bg); color: var(--good); border-color: rgba(95,224,160,.25); }
  .pill { font-size: 12px; padding: 6px 12px; }
  .pill.mine { background: var(--good-bg); color: var(--good); }
  .pill.taken { background: var(--chip); color: var(--muted); }
  .status { background: var(--chip); color: var(--text); }
  .s-Interested, .o-Interested { background: var(--blue-bg); color: var(--blue); }
  .s-Won, .o-Won { background: var(--good-bg); color: var(--good); }
  .s-Callback, .o-Callback { background: var(--warn-bg); color: var(--warn); }
  .s-Notinterested { background: var(--bad-bg); color: var(--bad); }
  .mylead { grid-template-columns: 1fr; }
  .due-line { color: var(--warn); font-weight: 700; font-size: 14px; }
  .lead.overdue .due-line { color: var(--bad); }
  .log { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 4px; }
  .outcomes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin: 6px 0 10px; }
  .out { border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); border-radius: 10px; padding: 11px 4px; font-weight: 700; font-size: 13px; transition: transform .15s, border-color .2s, background .2s; }
  .out:hover { border-color: rgba(226,185,104,.5); transform: translateY(-1px); }
  .o-Won { border-color: rgba(95,224,160,.35); } .o-Interested { border-color: rgba(138,180,255,.35); } .o-Callback { border-color: rgba(244,196,106,.35); }
  .badphone { color: var(--warn); font-weight: 600; font-size: 14px; }
  .maybe { font-size: 13px; color: var(--warn); background: var(--warn-bg); border: 1px solid rgba(244,196,106,.2); border-radius: 10px; padding: 7px 11px; margin-top: 10px !important; }

  /* ---------- tables ---------- */
  .tablewrap { overflow-x: auto; }
  table.board { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.board caption { text-align: left; color: var(--muted); font-size: 13px; padding-bottom: 8px; }
  table.board th, table.board td { padding: 11px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  table.board th { font-size: 11px; color: var(--faint); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
  table.board tbody tr { transition: background .2s; }
  table.board tbody tr:hover { background: rgba(255,255,255,.025); }
  table.board .n { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); }
  table.board tr.me td { background: rgba(226,185,104,.08); }
  table.board tr.top1 td:first-child, table.board tr.top2 td:first-child, table.board tr.top3 td:first-child { font-size: 18px; }
  table.board tr.off td { opacity: .45; }
  .you { font-style: normal; font-size: 10px; font-weight: 700; color: var(--accent-text); background: var(--gold); border-radius: 999px; padding: 2px 7px; margin-left: 4px; }
  table.pool input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--gold); }

  /* ---------- admin ---------- */
  .feed-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .feed-head h2 { margin: 0; }
  .feed-filters { display: flex; gap: 8px; }
  .feed-filters select, .feed-filters input { width: auto; padding: 7px 10px; }
  ul.feed { list-style: none; padding: 0; margin: 0; max-height: 540px; overflow-y: auto; }
  ul.feed li { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  ul.feed time { color: var(--faint); font-family: var(--mono); font-size: 12px; padding-top: 2px; }
  .ev-claim span b, .ev-call span b { color: var(--gold); }
  .filters { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .inline { display: flex; gap: 8px; align-items: center; }
  .inline input { max-width: 130px; }
  .inline.wide input { max-width: none; flex: 1; }
  form.card .primary { margin-top: 14px; }
  .chart svg { width: 100%; height: auto; }
  .chart .axis { stroke: var(--border-strong); }
  .chart .goalline { stroke: var(--gold); stroke-dasharray: 4 4; opacity: .7; }
  .chart .barfill { fill: url(#barGrad); fill: var(--maroon); }
  .chart .lbl { fill: var(--muted); font-size: 11px; font-family: var(--sans); }

  /* ---------- auth ---------- */
  .auth { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px 16px 0; position: relative; overflow: hidden; }
  .auth::before { content: ""; position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; top: -35vmax; left: -25vmax; pointer-events: none;
    background: radial-gradient(circle, rgba(156,28,48,.55), transparent 62%); filter: blur(20px); animation: drift 16s ease-in-out infinite alternate; }
  .auth::after { content: ""; position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; bottom: -35vmax; right: -25vmax; pointer-events: none;
    background: radial-gradient(circle, rgba(226,185,104,.25), transparent 62%); filter: blur(20px); animation: drift 20s ease-in-out infinite alternate-reverse; }
  @keyframes drift { to { transform: translate(6vmax, 5vmax) scale(1.08); } }
  .auth-card { position: relative; z-index: 1; width: 100%; max-width: 400px; padding: 32px 28px; text-align: center; border-radius: 22px;
    background: rgba(20, 13, 14, .72); backdrop-filter: blur(20px); border: 1px solid var(--border-strong);
    box-shadow: 0 0 0 1px rgba(226,185,104,.06), 0 40px 100px -30px rgba(0,0,0,.9); animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
  .auth-card form { text-align: left; }
  .auth-logo { width: 56px; height: auto; filter: drop-shadow(0 0 22px rgba(226,185,104,.45)); animation: pop .8s .15s cubic-bezier(.3,1.6,.5,1) both; }

  /* ---------- motion ---------- */

  @keyframes rise { from { opacity: 0; transform: translateY(16px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
  .pop { animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } }
  .confetti { position: fixed; top: -12px; width: 8px; height: 13px; border-radius: 2px; z-index: 60; pointer-events: none; animation: fall var(--d, 1.6s) cubic-bezier(.25,.6,.4,1) forwards; }
  @keyframes fall { to { transform: translate(var(--x, 0), 105vh) rotate(var(--r, 720deg)); opacity: .9; } }

  /* ---------- I CAN'T BE BOTHERED ---------- */
  .lockin-hero { position: relative; overflow: hidden; border-radius: 22px; padding: clamp(26px, 6vw, 56px); margin-bottom: 16px; border: 1px solid rgba(255,92,82,.25);
    background: radial-gradient(600px 300px at 100% 0%, rgba(226,185,104,.22), transparent 60%), radial-gradient(500px 300px at 0% 100%, rgba(156,28,48,.7), transparent 70%), #0e0607; }
  .lockin-hero::after { content: ""; position: absolute; inset: 0; background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px); pointer-events: none; }
  .lockin-hero h1 { font: 900 clamp(36px, 9vw, 88px)/.9 var(--sans); letter-spacing: -.055em; margin: 0; text-transform: uppercase; color: #fff; }
  .lockin-hero h1 .cross { position: relative; display: inline-block; color: #ff6b5e; }
  .lockin-hero h1 .cross::after { content: ""; position: absolute; left: -3%; right: -3%; top: 50%; height: .11em; background: var(--gold); box-shadow: 0 0 20px rgba(226,185,104,.8);
    transform: scaleX(0) rotate(-4deg); transform-origin: left; animation: strike .7s 1s cubic-bezier(.7,0,.2,1) forwards; }
  @keyframes strike { to { transform: scaleX(1) rotate(-4deg); } }
  .lockin-hero .tough { font-weight: 700; font-size: clamp(17px, 2.6vw, 22px); color: var(--gold); margin: 18px 0 0; opacity: 0; animation: rise .6s 1.6s both; }
  .glitch { animation: shake .5s .2s both; }
  @keyframes shake { 0%,100% { transform: none; } 20% { transform: translate(-3px, 1px) skewX(-4deg); } 40% { transform: translate(3px, -1px) skewX(3deg); } 60% { transform: translate(-2px, 0); } 80% { transform: translate(2px, 1px); } }
  .quote-card { position: relative; padding: 30px 24px 22px; margin-bottom: 16px; }

  .quote-card blockquote::before { content: "“"; position: absolute; top: -16px; left: 16px; font: 900 88px/1 var(--sans); color: var(--gold); opacity: .5; }
  .roast { margin: 0 0 16px; padding: 16px 18px; border-radius: 14px; background: var(--bad-bg); color: var(--bad); font-weight: 700; font-size: 17px; border: 1px solid rgba(255,92,82,.25); border-left: 4px solid var(--bad); }
  .roast small { display: block; font-weight: 500; color: var(--muted); margin-top: 6px; font-size: 13px; }
  .tips { counter-reset: tip; list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .tips li { counter-increment: tip; display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 12px; align-items: start; padding: 14px 16px; }
  .tips li::before { content: counter(tip, decimal-leading-zero); font: 700 22px/1.2 var(--mono); color: var(--gold); }
  .tips b { display: block; font-size: 16px; margin-bottom: 2px; }

  .sprint.running .clock { color: var(--gold); animation: pulse 1s ease-in-out infinite; }

  /* ---------- earnings, badges, scripts, modals, pop-ups ---------- */
  .earn { display: flex; justify-content: space-between; align-items: center; gap: 12px;

  /* ---------- payment on won deals ---------- */

  /* ---------- care plans ---------- */

  /* ---------- team chat ---------- */
